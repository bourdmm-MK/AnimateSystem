# Exam question: m and 2m slide down 60° slopes from rest, reach m3 = 3m on a
# spring at the same moment, stick to it, and the three oscillate together.
# Drawn as: PhysicsAid expermients/two_slopes_spring/ (Manim)
#           BlenderPhysics models/two_slopes_spring/ (Blender)
# Sizes below are illustrative; the scripts hold the exact numbers.

title: two slopes and a spring
source: text (exam question)
view: 2d-front
frame: { width: 14, height: 8 }

objects:
  - { id: floor,  kind: floor, at: [0, -2.5], size: { length: 12 } }
  - { id: slopeL, kind: slope, angle: 60, side: left,  foot: [-2, -2.5] }
  - { id: slopeR, kind: slope, angle: 60, side: right, foot: [ 2, -2.5] }
  - { id: m1, kind: block, label: "m",  on: slopeL, size: { width: 0.8, height: 0.8 } }
  - { id: m2, kind: block, label: "2m", on: slopeR, size: { width: 1.0, height: 1.0 } }
  - { id: m3, kind: block, label: "3m", at: [0, -2.0], size: { width: 1.2, height: 1.0 } }
  - { id: spring, kind: spring, from: floor, to: m3, vertical: true }

vectors:
  - { on: m1, quantity: velocity, along: slopeL, label: "\\vec v_1" }
  - { on: m2, quantity: velocity, along: slopeR, label: "\\vec v_2" }
  - { on: m1, quantity: force, direction: [0, -1], label: "m\\vec g" }

motion:
  equations: "slide: s'' = g sin(theta) (no friction); after impact: momentum conserved, then x'' = -(k/6m) x"
  parameters: { g: 9.8, theta: 60 }
  events: ["m1 and m2 reach m3 at the same moment and stick"]

steps:
  - draw: [floor, slopeL, slopeR, spring, m3]
  - draw: [m1, m2]
  - animate: slide
  - animate: oscillation
